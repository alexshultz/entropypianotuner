name: Add app icons

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  icons:
    runs-on: ubuntu-latest
    steps:
      - name: Write the six icon files onto main
        env:
          GH_TOKEN: ${{ github.token }}
          ICON_B64: 
        run: |
          set -euo pipefail
          python3 << 'PY'
          import base64, hashlib, json, os, urllib.request
          token = os.environ["GH_TOKEN"]
          raw = base64.b64decode("".join(os.environ["ICON_B64"].split()))
          if len(raw) != 6395 or not raw.startswith(b"\x89PNG\r\n\x1a\n"):
              raise SystemExit(f"bad icon bytes {len(raw)}")
          digest = hashlib.sha256(raw).hexdigest()
          expect = "fd694bb3afa3ca4dfaef9dfe92201c14a8cd15031212851583ace8cfbd380893"
          if digest != expect:
              raise SystemExit("sha256 " + digest)
          api = "https://api.github.com/repos/alexshultz/entropypianotuner"
          def call(method, path, body=None):
              data = None if body is None else json.dumps(body).encode()
              req = urllib.request.Request(api + path, data=data, method=method)
              req.add_header("Authorization", "Bearer " + token)
              req.add_header("Accept", "application/vnd.github+json")
              req.add_header("X-GitHub-Api-Version", "2022-11-28")
              if body is not None:
                  req.add_header("Content-Type", "application/json")
              with urllib.request.urlopen(req) as resp:
                  return json.load(resp)
          ref = call("GET", "/git/ref/heads/main")
          parent = ref["object"]["sha"]
          commit = call("GET", "/git/commits/" + parent)
          blob = call("POST", "/git/blobs", {"content": base64.b64encode(raw).decode(), "encoding": "base64"})
          paths = [
              "EntropyPianoTuner/Assets.xcassets/AppIcon.appiconset/AppIcon.png",
              "EntropyPianoTuner/Assets.xcassets/MacAppIcon.appiconset/AppIcon.png",
              "EntropyPianoTuner/Assets.xcassets/WatchAppIcon.appiconset/AppIcon.png",
              "EntropyPianoTuner/Assets.xcassets/VisionAppIcon.solidimagestack/Front.solidimagestacklayer/Content.imageset/AppIcon.png",
              "EntropyPianoTuner/Assets.xcassets/VisionAppIcon.solidimagestack/Middle.solidimagestacklayer/Content.imageset/AppIcon.png",
              "EntropyPianoTuner/Assets.xcassets/VisionAppIcon.solidimagestack/Back.solidimagestacklayer/Content.imageset/AppIcon.png",
          ]
          tree = call("POST", "/git/trees", {
              "base_tree": commit["tree"]["sha"],
              "tree": [{"path": p, "mode": "100644", "type": "blob", "sha": blob["sha"]} for p in paths],
          })
          person = {"name": "Alex Shultz", "email": "11370977+alexshultz@users.noreply.github.com"}
          created = call("POST", "/git/commits", {
              "message": "Add the app icon images.",
              "tree": tree["sha"],
              "parents": [parent],
              "author": person,
              "committer": person,
          })
          call("PATCH", "/git/refs/heads/main", {"sha": created["sha"]})
          print("commit", created["sha"])
          print("blob", blob["sha"])
          PY
